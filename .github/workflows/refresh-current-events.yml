name: Refresh Current Events Questions

on:
  schedule:
    # Refresh early every day so the static GitHub Pages build stays topical.
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: current-events-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Refresh static Current Events question pack
        run: npm run refresh-current-events -w packages/tools
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CURRENT_EVENTS_NEWS_COUNTRY: ${{ vars.CURRENT_EVENTS_NEWS_COUNTRY || 'us' }}
          CURRENT_EVENTS_NEWS_PAGE_SIZE: ${{ vars.CURRENT_EVENTS_NEWS_PAGE_SIZE || '30' }}
          CURRENT_EVENTS_NEWS_CATEGORY: ${{ vars.CURRENT_EVENTS_NEWS_CATEGORY }}
          CURRENT_EVENTS_OPENAI_MODEL: ${{ vars.CURRENT_EVENTS_OPENAI_MODEL || 'gpt-4o-mini' }}

      - name: Commit refreshed questions
        id: commit-refresh
        run: |
          if git diff --quiet -- packages/shared/src/questions/current-events.json; then
            echo "No Current Events question changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/src/questions/current-events.json
          git commit -m "chore: refresh current events questions"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits made with GITHUB_TOKEN do not trigger a separate push workflow,
      # so deploy the refreshed static build from this workflow too.
      - name: Build shared package
        if: steps.commit-refresh.outputs.changed == 'true'
        run: npm run build -w packages/shared

      - name: Build client with refreshed questions
        if: steps.commit-refresh.outputs.changed == 'true'
        run: npm run build -w packages/client
        env:
          VITE_SERVER_URL: https://trivia-jam.onrender.com

      - name: Upload GitHub Pages artifact
        if: steps.commit-refresh.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

      - name: Deploy refreshed GitHub Pages build
        if: steps.commit-refresh.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
